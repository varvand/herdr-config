onboarding = false

# Tokyo Night, matched to WezTerm, Starship, and SketchyBar.
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
sidebar_bg = "#1a1b26"
active_row_bg = "#24283b"
selection_bg = "#33467c"
accent = "#7aa2f7"
text = "#c0caf5"
subtext0 = "#565f89"
surface0 = "#1f2335"
surface1 = "#24283b"
# Hairline between Spaces, Agents, and the panes. The theme default matches
# the sidebar background, which hides the rule.
surface_dim = "#3b4261"
blue = "#7aa2f7"
green = "#9ece6a"
yellow = "#e0af68"
red = "#f7768e"
teal = "#73daca"
mauve = "#bb9af7"
peach = "#ff9e64"
overlay0 = "#565f89"

[ui]
accent = "#7aa2f7"
status_indicators = "symbols"
sidebar_width = 40
sidebar_min_width = 28
sidebar_max_width = 48
pane_gaps = true
pane_borders = "auto"
pane_outer_borders = true
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
tab_bar_right_separator = "  │  "
window_title = "{workspace}  ·  {tab}"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%a  %H:%M" },
]

# Projects. One workspace per repo: name, then branch and ahead/behind.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#c0caf5", bold = true }],
  [{ token = "branch", fg = "#9ece6a" }, "git_status"],
]

# $spin is a one-cell braille spinner, set only while that agent is working.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "$spin", fg = "#e0af68", bold = true, dim = false }, { token = "agent", fg = "#bb9af7", bold = true }, { token = "state_text", fg = "#565f89" }],
  [{ token = "terminal_title_stripped", fg = "#c0caf5" }],
  [{ token = "workspace", fg = "#7aa2f7" }, { token = "tab", fg = "#565f89" }],
]

# In-app toast when a background agent finishes or needs input.
# Mac Notification Center banners are posted by plugins/mac-notify.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "/Users/vincent/.config/herdr/recent-projects.sh"
description = "recent projects"
width = "78%"
height = "58%"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# Usage pane for Claude, Codex, and Grok account windows. Press again to hide.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "herdr-plugin-agent-quota.statusbar"
description = "toggle agent usage"

# Small prompt, same idea as the keybind panel. "claude 3" opens three panes.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "local.agent-spawn.open"
description = "spawn agents"
